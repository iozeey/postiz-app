services:
  postiz-app:
    # Built from this repository instead of pulling upstream's prebuilt image,
    # so the white-label actually ships. Everything below is unchanged from the
    # Dokploy template: same service names, same volume names, same env keys —
    # so switching to this file reuses the existing database and uploads.
    #
    # The NEXT_PUBLIC_* values must be BUILD ARGS, not runtime env: they are
    # read in a 'use client' component, so Next inlines them during the image
    # build. Supplying them at runtime silently does nothing.
    build:
      context: .
      dockerfile: Dockerfile.dev
      # No `target:` — Dockerfile.dev is single-stage. var/docker/docker-build.sh
      # still references `--target dist`, but that stage does not exist in the
      # current Dockerfile and specifying it fails the build.
      args:
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME}
        NEXT_PUBLIC_BRAND_MOTTO: ${NEXT_PUBLIC_BRAND_MOTTO}
        # Optional YouTube video id for the onboarding tutorial. Unset means the
        # final onboarding step is a thank-you screen instead of a video.
        NEXT_PUBLIC_BRAND_TUTORIAL_VIDEO: ${NEXT_PUBLIC_BRAND_TUTORIAL_VIDEO:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_TERMS_URL: ${NEXT_PUBLIC_TERMS_URL}
        NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL}
    restart: always

    # Wait for Temporal to answer the same call the apps make before starting
    # PM2. Both backend and orchestrator open their Temporal connection once
    # during NestJS init with no retry and no timeout: against a Temporal that
    # is not ready they hang in bootstrap forever — no crash, no error, PM2
    # still "online", nothing bound to port 3000 or 3002. Compose depends_on
    # was not enough, because the healthcheck passes before auto-setup has
    # finished registering the default namespace.
    #
    # describeNamespace is exactly what the SDK needs, so if this succeeds the
    # apps will connect. Gives up after 5 minutes and starts anyway rather than
    # blocking the deploy forever.
    command:
      - sh
      - -c
      - |
        cd /app
        for i in $$(seq 1 60); do
          node -e "
            const { Connection } = require('@temporalio/client');
            Connection.connect({ address: process.env.TEMPORAL_ADDRESS || 'temporal:7233' })
              .then((c) => c.workflowService.describeNamespace({ namespace: process.env.TEMPORAL_NAMESPACE || 'default' }))
              .then(() => process.exit(0))
              .catch(() => process.exit(1));
          " 2>/dev/null && echo "temporal ready" && break
          echo "waiting for temporal ($$i/60)"
          sleep 5
        done
        # Watchdog. The backend and orchestrator can block forever inside NestJS
        # module init when Temporal is reachable but not ready: the process stays
        # alive, consumes no CPU, never binds its port, and PM2 keeps reporting
        # "online". Observed 30 Sep and 1 Oct 2026 — two days of 502s with an
        # empty error log. Nothing in Docker or PM2 detects this, so we do.
        #
        # Grace period first, because a cold boot legitimately takes minutes
        # (prisma push, Next build cache, the orchestrator's workflow bundle).
        (
          sleep 420
          backend_fails=0
          orch_fails=0
          while true; do
            if node -e "require('net').connect(3000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})" 2>/dev/null; then
              backend_fails=0
            else
              backend_fails=$$((backend_fails+1))
              echo "[watchdog] backend port 3000 closed ($$backend_fails/3)"
              if [ "$$backend_fails" -ge 3 ]; then
                echo "[watchdog] restarting backend"
                pm2 restart backend
                backend_fails=0
                sleep 180
              fi
            fi
            if node -e "require('net').connect(3002,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})" 2>/dev/null; then
              orch_fails=0
            else
              orch_fails=$$((orch_fails+1))
              echo "[watchdog] orchestrator port 3002 closed ($$orch_fails/3)"
              if [ "$$orch_fails" -ge 3 ]; then
                echo "[watchdog] restarting orchestrator"
                pm2 restart orchestrator
                orch_fails=0
                sleep 180
              fi
            fi
            sleep 30
          done
        ) &

        nginx && pnpm run pm2

    # The only container that serves users was the only one without a
    # healthcheck, which is why Dokploy showed it "running" through a complete
    # two-day outage. This makes a hung backend visible in the Containers tab.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('net').connect(3000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 420s

    environment:
      MAIN_URL: "https://${POSTIZ_HOST}"
      FRONTEND_URL: "https://${POSTIZ_HOST}"
      NEXT_PUBLIC_BACKEND_URL: "https://${POSTIZ_HOST}/api"
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postiz-postgres:5432/${DB_NAME}"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      TEMPORAL_ADDRESS: "temporal:7233"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      RUN_CRON: "true"
      # NOT_SECURED is deliberately unset. With it on, the auth cookie loses
      # secure/httpOnly/sameSite, AND the logout button takes a client-side
      # path that writes document.cookie without a domain attribute — which
      # cannot clear a cookie set with Domain=.<apex>, so logout silently
      # fails. Unset, logout routes through the backend, which clears it
      # with the matching domain. Note the code tests bare truthiness, so
      # NOT_SECURED: "false" would still ENABLE it. It must stay absent.
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      
      # === Social Media API Settings ===
      # These variables should be defined in the Dokploy Environment tab.
      # For more configuration options and details, please refer to the official documentation.
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      # Instagram has two channels. "instagram" (via a Facebook Page) signs in
      # through the Facebook app above. "instagram-standalone" signs in with
      # Instagram Login, which uses the separate Instagram app ID and secret
      # shown under Instagram > API setup with Instagram login — not the
      # Facebook ones. Unset, the connect button sends client_id=undefined.
      #
      # Listing a key here is documentation, not a requirement: Dokploy writes
      # the Environment tab to .env in the build context, COPY . /app bakes it
      # into the image, and backend/orchestrator start with `dotenv -e .env`.
      # So every Environment-tab value reaches the app, listed or not — and a
      # changed value needs a Redeploy (rebuild), not just a restart.
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      X_API_KEY: ${X_API_KEY}
      X_API_SECRET: ${X_API_SECRET}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET}

      # === Email (Brevo over SMTP) ===
      # Every value comes from the Dokploy Environment tab. EMAIL_PROVIDER must
      # be exactly "nodemailer": EmailService switches on this string, and
      # anything else — including an unset value — selects EmptyProvider, which
      # accepts every send and drops it without an error.
      #
      # EMAIL_SECURE is compared against the literal string 'true'. Port 587 is
      # STARTTLS, so it stays "false"; set it true only alongside port 465.
      #
      # EMAIL_FROM_ADDRESS and EMAIL_FROM_NAME are absent from
      # NodeMailerProvider.validateEnvKeys, so a missing value is never
      # reported — sendEmailSync just returns before sending. Keep both set.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}

    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        # service_started is enough here: the container's own command waits for
        # Temporal to answer describeNamespace before starting PM2. Gating on
        # service_healthy as well risks a flaky probe blocking startup entirely,
        # and the in-container wait cannot deadlock because it times out.
        condition: service_started

  postiz-postgres:
    image: postgres:17-alpine
    restart: always

    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  postiz-redis:
    image: redis:7.2
    restart: always

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    # restart: always is load-bearing. Without it, a Docker or host restart
    # brings back only the services that have a policy — postiz-app, postgres
    # and redis — and leaves the Temporal stack exited. The backend then cannot
    # resolve `temporal` at boot, dies in TemporalRegister.onModuleInit, and the
    # whole site 502s until someone notices. That is what took it down on
    # 30 Sep and 1 Oct 2026.
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data

  temporal-postgresql:
    image: postgres:16
    # restart: always is load-bearing. Without it, a Docker or host restart
    # brings back only the services that have a policy — postiz-app, postgres
    # and redis — and leaves the Temporal stack exited. The backend then cannot
    # resolve `temporal` at boot, dies in TemporalRegister.onModuleInit, and the
    # whole site 502s until someone notices. That is what took it down on
    # 30 Sep and 1 Oct 2026.
    restart: always
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_PASSWORD}
      POSTGRES_USER: ${TEMPORAL_USER}
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.28.1
    # restart: always is load-bearing. Without it, a Docker or host restart
    # brings back only the services that have a policy — postiz-app, postgres
    # and redis — and leaves the Temporal stack exited. The backend then cannot
    # resolve `temporal` at boot, dies in TemporalRegister.onModuleInit, and the
    # whole site 502s until someone notices. That is what took it down on
    # 30 Sep and 1 Oct 2026.
    restart: always
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        # Temporal runs its index setup against Elasticsearch at boot. Starting
        # before ES can answer leaves Temporal up but not serving.
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL_USER}
      - POSTGRES_PWD=${TEMPORAL_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    healthcheck:
      # auto-setup binds the container's own IP, never loopback, so a
      # 127.0.0.1 probe fails even when Temporal is serving perfectly.
      # This reported "unhealthy" for days while the server was fine.
      # $$ escapes Compose interpolation. hostname -i is the address
      # auto-setup actually bound, so this cannot fail on DNS — which
      # matters now that postiz-app will not start until this passes.
      test: ["CMD-SHELL", "tctl --address $$(hostname -i):7233 workflow list"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  temporal-es-data:
  temporal-pg-data:
