services:
  postiz-app:
    # Built from this repository instead of pulling upstream's prebuilt image,
    # so the white-label actually ships. Everything below is unchanged from the
    # Dokploy template: same service names, same volume names, same env keys —
    # so switching to this file reuses the existing database and uploads.
    #
    # The NEXT_PUBLIC_* values must be BUILD ARGS, not runtime env: they are
    # read in a 'use client' component, so Next inlines them during the image
    # build. Supplying them at runtime silently does nothing.
    build:
      context: .
      dockerfile: Dockerfile.dev
      # No `target:` — Dockerfile.dev is single-stage. var/docker/docker-build.sh
      # still references `--target dist`, but that stage does not exist in the
      # current Dockerfile and specifying it fails the build.
      args:
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME}
        NEXT_PUBLIC_BRAND_MOTTO: ${NEXT_PUBLIC_BRAND_MOTTO}
        # Optional YouTube video id for the onboarding tutorial. Unset means the
        # final onboarding step is a thank-you screen instead of a video.
        NEXT_PUBLIC_BRAND_TUTORIAL_VIDEO: ${NEXT_PUBLIC_BRAND_TUTORIAL_VIDEO:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_TERMS_URL: ${NEXT_PUBLIC_TERMS_URL}
        NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL}
    restart: always

    environment:
      MAIN_URL: "https://${POSTIZ_HOST}"
      FRONTEND_URL: "https://${POSTIZ_HOST}"
      NEXT_PUBLIC_BACKEND_URL: "https://${POSTIZ_HOST}/api"
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postiz-postgres:5432/${DB_NAME}"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      TEMPORAL_ADDRESS: "temporal:7233"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      RUN_CRON: "true"
      # NOT_SECURED is deliberately unset. With it on, the auth cookie loses
      # secure/httpOnly/sameSite, AND the logout button takes a client-side
      # path that writes document.cookie without a domain attribute — which
      # cannot clear a cookie set with Domain=.<apex>, so logout silently
      # fails. Unset, logout routes through the backend, which clears it
      # with the matching domain. Note the code tests bare truthiness, so
      # NOT_SECURED: "false" would still ENABLE it. It must stay absent.
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      
      # === Social Media API Settings ===
      # These variables should be defined in the Dokploy Environment tab.
      # For more configuration options and details, please refer to the official documentation.
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      X_API_KEY: ${X_API_KEY}
      X_API_SECRET: ${X_API_SECRET}

    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        # Must be service_healthy, not service_started. The orchestrator opens
        # its Temporal connection once at boot and has no retry: if it starts
        # against a Temporal that is not accepting connections yet, it hangs in
        # NestJS module init forever — no error, no crash, PM2 still reports
        # "online", and every post silently sits in QUEUE because
        # startWorkflow() swallows the failure (posts.service.ts:768).
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    restart: always

    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  postiz-redis:
    image: redis:7.2
    restart: always

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data

  temporal-postgresql:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_PASSWORD}
      POSTGRES_USER: ${TEMPORAL_USER}
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        # Temporal runs its index setup against Elasticsearch at boot. Starting
        # before ES can answer leaves Temporal up but not serving.
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL_USER}
      - POSTGRES_PWD=${TEMPORAL_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    healthcheck:
      # auto-setup binds the container's own IP, never loopback, so a
      # 127.0.0.1 probe fails even when Temporal is serving perfectly.
      # This reported "unhealthy" for days while the server was fine.
      # $$ escapes Compose interpolation. hostname -i is the address
      # auto-setup actually bound, so this cannot fail on DNS — which
      # matters now that postiz-app will not start until this passes.
      test: ["CMD-SHELL", "tctl --address $$(hostname -i):7233 workflow list"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  temporal-es-data:
  temporal-pg-data:
